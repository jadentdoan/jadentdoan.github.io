<!DOCTYPE html>
<html>
    <head>
        <title>JavaScripting</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div id="content">
            <header id="header-main">
                <h1>Introduction Assignment</h1>
                <h2>JavaScript</h2>
            </header>
            <main>
                <div class="columns">
                    <section id="speech" class="column">
                        <h3>Speech</h3>
                        <p id="speech-bubble" class="hidden">Hi</p>
                    </section>
                    <section class="column">
                        <h3>Beverage</h3>
                        <label for="select-beverage">Pick your morning beverage:</label>
                        <select id="select-beverage">
                            <option value="Coffee">Coffee</option>
                            <option value="Apple Juice">Apple Juice</option>
                            <option value="Orange Juice">Orange Juice</option>
                            <option value="Water">Water</option>
                        </select>
                        <p id="message"></p>
                    </section>
                    <section class="column">
                        <h3>Add a Sticker</h3>
                        <div id="sticker">
                            <img id="sun" src="sun.jpg" alt="A glossy golden sun" width="200" height="200" />
                            <span id="sun-sticker" class="hidden">🌞</span>
                        </div>
                    </section>
                </div>
            </main>
            <footer>
                <p>@jadentdoan</p>
            </footer>
        </div>
    </body>
    <script src="index.js"></script>
</html>
