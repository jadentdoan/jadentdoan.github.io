<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Conditionals</title>
        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body>
        <div id="content">
            <header id="main-header">
                <h1>Conditionals Assignment</h1>
                <h2>If Statements</h2>
            </header>
                <nav>
                    <button id="menu-toggle">▼</button>

                    <ul id="menu-items">
                        <li><button id="exercise-1">Exercise 1</button></li>
                        <li><button id="exercise-2">Exercise 2</button></li>
                    </ul>
                </nav>
            <main>
                <section id="missing-class">
                    <h3>Missing Class Point Deducter</h3>
                    <label for="days-missed">How many days do you intend to miss class?</label>
                    <input type="number" id="days-missed" min="0" max="25" step="1">

                    <p id="deduction"></p>
                    <p id="attendance-message"></p>
                </section>
                <section id="semester-counter" class="hide">
                    <h3>End of Semester Counter</h3>

                    <p id="days-remaining"></p>
                    <p id="semester-message"></p>
                </section>
            </main>
            <footer>
                <p>&copy;jadentdoan</p>
            </footer>
        </div>
        <script src="index.js"></script>
    </body>
</html>
